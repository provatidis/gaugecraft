name: Verify the November 17 recovery copy
on:
  push:
    branches: [recovery-drill/2026-11-17]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare the isolated runner
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/drill-browser" playwright-core@1.56.1 --no-save --ignore-scripts
          VITE_DATA_MODE=api pnpm build
      - name: Restore the scheduled backup and verify its checksum and SQLite integrity
        id: restore
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          date -u +%s > "$RUNNER_TEMP/recovery-start"
          node --import tsx server/object-backup-cli.ts restore backups/2026-11-17T13-35-06.993Z-nnTKQC "$RUNNER_TEMP/drill.sqlite"
          echo "Restore and integrity check took $(($(date -u +%s) - $(cat "$RUNNER_TEMP/recovery-start"))) seconds."
          date -u +%T
      - name: Record recovered history and reproduce a saved decision
        run: node --import tsx scripts/drill-evidence.ts "$RUNNER_TEMP/drill.sqlite"
      - name: Verify Markets, Opportunities and Performance from the recovery copy
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          DRILL_PLAYWRIGHT: ${{ runner.temp }}/drill-browser/node_modules/playwright-core/index.mjs
          DRILL_REPO: ${{ github.workspace }}
        run: |
          DRILL_CHROME="$(command -v google-chrome)" node scripts/drill-views.mjs "$RUNNER_TEMP/drill.sqlite"
          echo "Total from restore start through browser and benchmark verification: $(($(date -u +%s) - $(cat "$RUNNER_TEMP/recovery-start"))) seconds."
