name: Rebuild a Base fee comparison after isolated recovery
on:
  push:
    branches: [recovery-drill/2026-11-17]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare the isolated runner
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Restore the scheduled backup and verify its checksum and SQLite integrity
        id: restore
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          date -u +%s > "$RUNNER_TEMP/recovery-start"
          node --import tsx server/object-backup-cli.ts restore backups/2026-11-17T13-35-06.993Z-nnTKQC "$RUNNER_TEMP/drill.sqlite"
          echo "Restore and integrity check took $(($(date -u +%s) - $(cat "$RUNNER_TEMP/recovery-start"))) seconds."
          date -u +%T
      - name: Rebuild the two Base fee records on a scratch copy and independently replay the result
        run: |
          cp --reflink=auto "$RUNNER_TEMP/drill.sqlite" "$RUNNER_TEMP/base-replay.sqlite"
          node --import tsx scripts/drill-base.ts "$RUNNER_TEMP/base-replay.sqlite"
          node --import tsx scripts/drill-evidence.ts "$RUNNER_TEMP/base-replay.sqlite"
